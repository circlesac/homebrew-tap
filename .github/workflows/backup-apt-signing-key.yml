name: Back up APT signing key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt signing key for one-time recovery
        env:
          APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
          RECOVERY_CERT_B64: ""
        run: |
          test -n "$APT_SIGNING_PRIVATE_KEY"
          printf '%s' "$RECOVERY_CERT_B64" \
            | base64 --decode > "$RUNNER_TEMP/recovery-cert.pem"
          printf '%s\n' "$APT_SIGNING_PRIVATE_KEY" \
            | openssl cms -encrypt \
                -aes-256-cbc \
                -binary \
                -outform PEM \
                -out apt-signing-key.asc.cms.pem \
                "$RUNNER_TEMP/recovery-cert.pem"
          grep -Fq -- '-----BEGIN CMS-----' apt-signing-key.asc.cms.pem

      - uses: actions/upload-artifact@v4
        with:
          name: apt-signing-key-backup
          path: apt-signing-key.asc.cms.pem
          retention-days: 1
