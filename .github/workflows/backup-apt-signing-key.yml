name: Back up APT signing key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Encrypt signing key for one-time recovery
        env:
          APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$APT_SIGNING_PRIVATE_KEY"
          printf '%s\n' "$APT_SIGNING_PRIVATE_KEY" \
            | age --encrypt \
                --recipient "age1y7j50dlenmrpgs8zahayveg5r0rsvhghqet7qq0ettqcm4n4gc7s0m6y8j" \
                --output apt-signing-key.asc.age
          grep -Fq 'age-encryption.org/v1' apt-signing-key.asc.age

      - uses: actions/upload-artifact@v4
        with:
          name: apt-signing-key-backup
          path: apt-signing-key.asc.age
          retention-days: 1
